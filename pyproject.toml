[project]
name = "scdl"
version = "0.1.0"
description = "Download SoundCloud tracks at the best available quality, falling back to YouTube"
readme = "README.md"
requires-python = ">=3.14"
# The single list of runtime dependencies. The Dockerfile installs exactly
# what uv.lock resolves from here; nothing else declares them.
dependencies = [
    "fastapi>=0.136.1",
    "starlette>=1.0.0",
    "uvicorn>=0.27",
    # [default] pulls in yt-dlp-ejs, the script bun runs to solve YouTube's
    # JS challenges. Without it every YouTube download fails with "The page
    # needs to be reloaded".
    "yt-dlp[default]>=2025.11",
    "httpx>=0.27",
    "mutagen>=1.47",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff.lint]
# Pinned explicitly rather than inheriting ruff's defaults, which shift between
# releases — a laptop and CI should never disagree about what passes.
select = ["E4", "E7", "E9", "F"]

# Deliberately not enabled: BLE001, S110, S112. Broad `except Exception` is the
# house style here and there are ~20 sites of it. A failed artwork fetch, tag
# write, cookie parse or transcode must degrade that one download and never
# take down the stream, so catching narrowly would mean enumerating every way
# httpx, ffmpeg, yt-dlp and mutagen can fail — and being wrong occasionally.
